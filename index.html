<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whatsapp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
</head>

<body>
    <div class="container" id="settings">
        <input id="fileUpload" type="file" accept=".txt" onchange="getFile(this)" />


        <div class="analysisOption">
            <input id="dateAnalysis" class="form-check-input" type="checkbox">
            <label class="form-check-label" for="dateAnalysis">Chronoanalyse</label>
        </div>

        <div class="analysisOption">
            <input id="messageAnalysis" class="form-check-input" type="checkbox">
            <label class="form-check-label" for="messageAnalysis">Semantische Analyse</label>
        </div>

        <div class="analysisOption">
            <input id="moodAnalysis" class="form-check-input" type="checkbox">
            <label class="form-check-label" for="moodAnalysis">Stimmungsanalyse Analyse</label>
        </div>

        <button type="button" class="btn btn-primary" onclick="analyzeFile()">Absenden</button>
    </div>
    <div id="analysisContainer" class="card p-3 w-50 m-auto ">
        <!-- Carousel structure -->
        <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-inner">
            <!-- Date Analysis Content -->
            <div class="carousel-item active" id="dateAnalysisContent">
              <!-- Your content for date analysis goes here -->
              <p>Date Analysis Content</p>
            </div>
            <!-- Sem Analysis Content -->
            <div class="carousel-item" id="semAnalysisContent">
              <!-- Your content for semantic analysis goes here -->
              <p>Semantic Analysis Content</p>
            </div>
            <!-- Mood Analysis Content -->
            <div class="carousel-item" id="moodAnalysisContent">
              <!-- Your content for mood analysis goes here -->
              <p>Mood Analysis Content</p>
            </div>
          </div>
          <!-- Carousel controls -->
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
            <span class="carousel-control-prev-icon border border-2" aria-hidden="true" style="background-color: black;"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
            <span class="carousel-control-next-icon border border-2" aria-hidden="true" style="background-color: black;"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </div>
      
</body>

</html>
